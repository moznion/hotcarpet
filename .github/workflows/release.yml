name: Release

# Builds the binaries and uploads them to the GitHub release that tagpr has
# created (see .github/workflows/tagpr.yml). It can also be run by hand to
# (re-)upload the assets of an existing release.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (e.g. v0.3.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.3.0)
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  upload-assets:
    name: Upload assets (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Build and upload binary
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: hotcarpet
          target: ${{ matrix.target }}
          # Archive name (extension is added automatically: .tar.gz on unix, .zip on windows).
          archive: $bin-$tag-$target
          # Attach extra files to the archive.
          include: README.md,LICENSE
          # Generate a SHA-256 checksum alongside each archive.
          checksum: sha256
          ref: refs/tags/${{ inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
