name: tagpr

# Maintains a release pull request on main with Songmu/tagpr. Merging it tags
# the release, creates the GitHub release, and then builds/uploads the binaries.
on:
  push:
    branches: [main]

jobs:
  tagpr:
    name: tagpr
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the release branch, tags and create the release
      pull-requests: write # to open/update the release pull request
      issues: write # to create the version-bump labels
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Required by `tagpr.command` (cargo update) to refresh Cargo.lock.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: tagpr
        id: tagpr
        uses: Songmu/tagpr@967f2ab22be958948fb5bd439bfa3d404dd9dee8 # v1.21.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so the release
  # workflow is called directly once tagpr has tagged a release.
  release:
    name: Release
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    permissions:
      contents: write # to upload the binaries to the release
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tagpr.outputs.tag }}
