[package]
name = "hotcarpet"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = "7.2.2"
git2 = "0.21.0"
globset = "0.4.18"
oxc_allocator = "0.140"
oxc_ast = "0.140"
oxc_ast_visit = "0.140"
oxc_parser = "0.140"
oxc_span = "0.140"
oxc_syntax = "0.140"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
syn = { version = "2.0", features = ["full", "visit", "printing"] }
toml = "1.1.2"
tree-sitter = "0.26"
tree-sitter-go = "0.25"
# Fork of the fwcd Kotlin grammar carrying extra parse fixes. It has no
# crates.io release, so it is pinned by rev. Dependabot cannot update this pin.
tree-sitter-kotlin = { git = "https://github.com/exoego/tree-sitter-kotlin", rev = "97ab2826bf686723ca7dcc34d55f758d9c41a59d" }
tree-sitter-scala = "0.26.2"
